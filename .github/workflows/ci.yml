name: WINUX11 CI
on: [push, pull_request]
concurrency:
  group: winux11-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Qt build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if cmake -S . -B probe -G Ninja -DWINUX11_BUILD_TESTS=OFF; then
            echo "Qt development environment already usable"
          else
            pkgs="build-essential cmake ninja-build pkg-config libxkbcommon-dev qt6-base-dev qt6-declarative-dev qt6-wayland-dev"
            sudo apt-get install --no-install-recommends -y $pkgs || { sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update && sudo apt-get install --no-install-recommends -y $pkgs; }
          fi
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWINUX11_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install validation
        run: cmake --install build --prefix "$RUNNER_TEMP/winux11-root"
      - name: Validate session scripts
        run: |
          sh -n session/winux11-session
          sh -n installer/install.sh
          test -x "$RUNNER_TEMP/winux11-root/bin/winux11-compositor"
          test -x "$RUNNER_TEMP/winux11-root/bin/winux11-shell"
          test -x "$RUNNER_TEMP/winux11-root/bin/winux11-session"
          test -f "$RUNNER_TEMP/winux11-root/share/wayland-sessions/winux11.desktop"
      - name: Headless compositor/session smoke
        run: |
          mkdir -p "$RUNNER_TEMP/winux11-runtime"
          chmod 700 "$RUNNER_TEMP/winux11-runtime"
          timeout 8s env QT_QPA_PLATFORM=offscreen XDG_RUNTIME_DIR="$RUNNER_TEMP/winux11-runtime" WINUX11_PREFIX="$RUNNER_TEMP/winux11-root" WINUX11_COMPOSITOR_QPA_PLATFORM=offscreen WINUX11_COMPOSITOR_QT_QUICK_BACKEND=software WINUX11_HEADLESS_SMOKE=1 sh session/winux11-session
