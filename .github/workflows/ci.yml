name: WINUX11 CI
on: [push, pull_request]
concurrency:
  group: winux11-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Qt build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          pkgs="build-essential cmake ninja-build pkg-config libxkbcommon-dev qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-wayland-dev qt6-wayland xvfb xauth qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtwebengine"
          sudo apt-get install --no-install-recommends -y $pkgs || {
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update
            sudo apt-get install --no-install-recommends -y $pkgs
          }
          test -f /usr/lib/x86_64-linux-gnu/qt6/plugins/wayland-graphics-integration-server/libqt-wayland-compositor-dmabuf-server-buffer.so
      - name: Validate QML syntax
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' file; do
            set +e
            output=$(/usr/lib/qt6/bin/qmlformat "$file" 2>&1)
            result=$?
            set -e
            if [ "$result" -ne 0 ]; then
              status=1
              details=$(printf '%s\n' "$output" | tail -n 8 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
              [ -n "$details" ] || details="qmlformat failed with status $result"
              printf '::error file=%s,line=1::%s\n' "$file" "$details"
            fi
          done < <(find applications shell -name "*.qml" -print0)
          exit "$status"
      - name: Build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWINUX11_BUILD_TESTS=ON && cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install validation
        run: cmake --install build --prefix "$RUNNER_TEMP/winux11-root"
      - name: Validate session scripts
        run: |
          sh -n session/winux11-session
          sh -n installer/install.sh
          test -x "$RUNNER_TEMP/winux11-root/bin/winux11-compositor"
          test -x "$RUNNER_TEMP/winux11-root/bin/winux11-shell"
          test -x "$RUNNER_TEMP/winux11-root/bin/winux11-calendar"
          test -x "$RUNNER_TEMP/winux11-root/bin/winux11-session"
          test -f "$RUNNER_TEMP/winux11-root/share/xsessions/winux11.desktop"
          test -f "$RUNNER_TEMP/winux11-root/share/wayland-sessions/winux11-wayland.desktop"
      - name: Smoke test WINUX11 session startup
        env:
          WINUX11_PREFIX: ${{ runner.temp }}/winux11-root
        run: tests/session_smoke.sh
