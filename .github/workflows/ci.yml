name: WINUX11 CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install core dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libxkbcommon-dev qt6-base-dev qt6-declarative-dev qt6-wayland-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWINUX11_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install validation
        run: cmake --install build --prefix "$RUNNER_TEMP/winux11-root"
      - name: Validate session
        run: |
          sh -n session/winux11-session
          sh -n installer/install.sh
          test -x "$RUNNER_TEMP/winux11-root/bin/winux11-compositor"
          test -x "$RUNNER_TEMP/winux11-root/bin/winux11-shell"
          test -f "$RUNNER_TEMP/winux11-root/share/wayland-sessions/winux11.desktop"

  webengine:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install optional WebEngine dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config qt6-base-dev qt6-declarative-dev qt6-wayland-dev qt6-webengine-dev
      - name: Configure
        run: cmake -S . -B build-webengine -G Ninja -DCMAKE_BUILD_TYPE=Release -DWINUX11_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build-webengine --parallel
